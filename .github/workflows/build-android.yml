name: Build Android

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: npm

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21

      - run: npm ci
      - run: npm run build
      - run: npx cap add android
      - run: npx cap sync android

      - name: Generate app icons and splash
        run: npx capacitor-assets generate --android

      - name: Use Gradle 8.14.6
        run: |
          # Capacitor's template pins 8.14.3, whose release asset currently 504s
          # from the wrapper's redirect target. 8.14.6 is the latest 8.x patch and
          # is compatible with the template's Android Gradle Plugin 8.13.
          PROP=android/gradle/wrapper/gradle-wrapper.properties
          sed -i -E 's#gradle-[0-9.]+-(all|bin)\.zip#gradle-8.14.6-bin.zip#' "$PROP"
          if grep -q '^networkTimeout=' "$PROP"; then
            sed -i -E 's/^networkTimeout=.*/networkTimeout=120000/' "$PROP"
          else
            echo 'networkTimeout=120000' >> "$PROP"
          fi
          cat "$PROP"

      - uses: actions/cache@v6
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper/dists
            ~/.gradle/notifications
          key: gradle-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: Create google-services.json
        run: echo '${{ secrets.GOOGLE_SERVICES_JSON }}' > android/app/google-services.json

      - name: Build APK
        working-directory: android
        env:
          GRADLE_OPTS: >-
            -Dorg.gradle.internal.http.connectionTimeout=120000
            -Dorg.gradle.internal.http.socketTimeout=120000
        run: |
          for attempt in 1 2 3; do
            if ./gradlew assembleDebug --no-daemon; then
              exit 0
            fi
            echo "Gradle build attempt ${attempt} failed; retrying in 20s..."
            sleep 20
          done
          exit 1

      - name: Rename APK with version
        run: |
          VERSION=${GITHUB_REF_NAME:-dev}
          cp android/app/build/outputs/apk/debug/app-debug.apk xmpp-chat-${VERSION}.apk

      - uses: actions/upload-artifact@v7
        with:
          name: app-debug.apk
          path: xmpp-chat-*.apk

      - name: Create or update release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v3
        with:
          files: xmpp-chat-*.apk
          generate_release_notes: true
