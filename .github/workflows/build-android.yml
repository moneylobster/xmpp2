name: Build Android

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: npm

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21

      - run: npm ci
      - run: npm run build
      - run: npx cap add android
      - run: npx cap sync android

      - name: Generate app icons and splash
        run: npx capacitor-assets generate --android

      - name: Cache Gradle distribution
        id: gradle-dist
        uses: actions/cache@v6
        with:
          path: ~/gradle-8.14.3
          key: gradle-dist-8.14.3-${{ runner.os }}

      - name: Install Gradle 8.14.3
        if: steps.gradle-dist.outputs.cache-hit != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # The wrapper's distribution URL redirects to github.com, which has been
          # returning 504 for this asset. The GitHub API asset endpoint redirects
          # to a different CDN host and is reliable, so fetch Gradle there and use
          # the `gradle` command instead of `./gradlew`.
          ASSET_ID=$(curl -fsSL --retry 5 --retry-all-errors \
            -H "Authorization: Bearer $GH_TOKEN" \
            https://api.github.com/repos/gradle/gradle-distributions/releases/tags/v8.14.3 \
            | jq -r '.assets[] | select(.name == "gradle-8.14.3-bin.zip") | .id')
          test -n "$ASSET_ID"
          test "$ASSET_ID" != "null"
          curl -fL --retry 5 --retry-delay 10 --retry-all-errors \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/octet-stream" \
            -o "$RUNNER_TEMP/gradle.zip" \
            "https://api.github.com/repos/gradle/gradle-distributions/releases/assets/${ASSET_ID}"
          unzip -q "$RUNNER_TEMP/gradle.zip" -d "$HOME"
          chmod +x "$HOME/gradle-8.14.3/bin/gradle"
          "$HOME/gradle-8.14.3/bin/gradle" --version

      - name: Add Gradle to PATH
        run: |
          chmod +x "$HOME/gradle-8.14.3/bin/gradle"
          echo "$HOME/gradle-8.14.3/bin" >> "$GITHUB_PATH"

      - uses: actions/cache@v6
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/notifications
          key: gradle-cache-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            gradle-cache-${{ runner.os }}-

      - name: Create google-services.json
        run: echo '${{ secrets.GOOGLE_SERVICES_JSON }}' > android/app/google-services.json

      - name: Build APK
        working-directory: android
        env:
          GRADLE_OPTS: >-
            -Dorg.gradle.internal.http.connectionTimeout=120000
            -Dorg.gradle.internal.http.socketTimeout=120000
        run: |
          for attempt in 1 2 3; do
            if gradle assembleDebug --no-daemon; then
              exit 0
            fi
            echo "Gradle build attempt ${attempt} failed; retrying in 20s..."
            sleep 20
          done
          exit 1

      - name: Rename APK with version
        run: |
          VERSION=${GITHUB_REF_NAME:-dev}
          cp android/app/build/outputs/apk/debug/app-debug.apk xmpp-chat-${VERSION}.apk

      - uses: actions/upload-artifact@v7
        with:
          name: app-debug.apk
          path: xmpp-chat-*.apk

      - name: Create or update release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v3
        with:
          files: xmpp-chat-*.apk
          generate_release_notes: true
