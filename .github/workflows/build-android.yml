name: Build Android

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: npm

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21

      - run: npm ci
      - run: npm run build
      - run: npx cap add android
      - run: npx cap sync android

      - name: Generate app icons and splash
        run: npx capacitor-assets generate --android

      - name: Use Maven Central mirror
        run: |
          # Maven Central is redirecting some artifacts to github.com Releases,
          # which is currently returning 504. Google's Maven Central mirror serves
          # the same artifacts directly.
          find android -name '*.gradle' -print0 | xargs -0 sed -i \
            's#mavenCentral()#maven { url = "https://maven-central.storage-download.googleapis.com/maven2/" }#g'
          grep -R "maven-central.storage-download" android | head -5

      - name: Cache Gradle distribution
        id: gradle-dist
        uses: actions/cache@v6
        with:
          path: ~/gradle-8.14.6
          key: gradle-dist-8.14.6-${{ runner.os }}

      - name: Download Gradle 8.14.6
        if: steps.gradle-dist.outputs.cache-hit != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # The wrapper's services.gradle.org URL redirects to github.com's
          # release-download endpoint, which is currently returning 504 for these
          # assets. gh uses the API asset endpoint (release-assets.githubusercontent.com)
          # instead, which is not affected.
          rm -rf "$HOME/gradle-8.14.6"
          gh release download v8.14.6 \
            --repo gradle/gradle-distributions \
            --pattern gradle-8.14.6-bin.zip \
            --dir "$RUNNER_TEMP" \
            --clobber
          unzip -q "$RUNNER_TEMP/gradle-8.14.6-bin.zip" -d "$HOME"
          chmod +x "$HOME/gradle-8.14.6/bin/gradle"
          "$HOME/gradle-8.14.6/bin/gradle" --version

      - name: Add Gradle to PATH
        run: |
          chmod +x "$HOME/gradle-8.14.6/bin/gradle"
          echo "$HOME/gradle-8.14.6/bin" >> "$GITHUB_PATH"

      - uses: actions/cache@v6
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/notifications
          key: gradle-cache-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            gradle-cache-${{ runner.os }}-

      - name: Create google-services.json
        run: echo '${{ secrets.GOOGLE_SERVICES_JSON }}' > android/app/google-services.json

      - name: Build APK
        working-directory: android
        env:
          GRADLE_OPTS: >-
            -Dorg.gradle.internal.http.connectionTimeout=120000
            -Dorg.gradle.internal.http.socketTimeout=120000
        run: gradle assembleDebug --no-daemon

      - name: Rename APK with version
        run: |
          VERSION=${GITHUB_REF_NAME:-dev}
          cp android/app/build/outputs/apk/debug/app-debug.apk xmpp-chat-${VERSION}.apk

      - uses: actions/upload-artifact@v7
        with:
          name: app-debug.apk
          path: xmpp-chat-*.apk

      - name: Create or update release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v3
        with:
          files: xmpp-chat-*.apk
          generate_release_notes: true
